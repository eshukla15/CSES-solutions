<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
        </head>
<body>
    <h1>Staff</h1>
    <div>
        <div>
            <small>Most Common Domain</small>
            <h3 id="commonDomainText">Loading...</h3>
        </div>
    </div>

    <table id="userTable">
        <thead>
            <tr>
                <th>Company Name</th>
                <th>Username</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            </tbody>
    </table>

    <div class="card" style="margin-top: 30px;">
        <h3>Headcount by Company</h3>
        <ul id="companyCountsList"></ul>
    </div>

    <script>
        async function initDashboard() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                
                processAndDisplay(users);
            } catch (err) {
                console.error("Failed to fetch users:", err);
            }
        }

        function processAndDisplay(users) {
            const domainCounts = {};
            const companyCounts = {};

            users.forEach(user => {
                const domain = user.email.split('@')[1];
                domainCounts[domain] = (domainCounts[domain] || 0) + 1;

                const cName = user.company.name;
                companyCounts[cName] = (companyCounts[cName] || 0) + 1;
            });

            // Find max domain
            const commonDomain = Object.keys(domainCounts).reduce((a, b) => 
                domainCounts[a] > domainCounts[b] ? a : b
            );

            const sortedUsers = users.sort((a, b) => {
                const nameA = a.company.name.toLowerCase();
                const nameB = b.company.name.toLowerCase();

                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;

                // If companies are the same, sort by username length descending
                return b.username.length - a.username.length;
            });

            
            renderUI(sortedUsers, commonDomain, companyCounts);
        }

        function renderUI(users, commonDomain, companyCounts) {
            const tableBody = document.getElementById('userTableBody');
            const countsList = document.getElementById('companyCountsList');
            document.getElementById('commonDomainText').innerText = `@${commonDomain}`;

            tableBody.innerHTML = users.map(user => {
                const isHighlight = user.email.endsWith(commonDomain);
                return `
                    <tr class="${isHighlight ? 'common-domain-row' : ''}">
                        <td><strong>${user.company.name}</strong></td>
                        <td>${user.username} <span class="badge">len: ${user.username.length}</span></td>
                        <td>${user.email}</td>
                    </tr>
                `;
            }).join('');

            // Build Company Stats
            countsList.innerHTML = Object.entries(companyCounts)
                .map(([name, count]) => `<li>${name}: <strong>${count}</strong> employees</li>`)
                .join('');
        }

        
        initDashboard();
    </script>
</body>
</html>
